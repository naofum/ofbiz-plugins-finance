###############################################################################
# Finance plugin properties
# These are the system-wide defaults for interest calculation.
# All values can be overridden at runtime via the SystemProperty entity
# (webtools -> SystemProperty, systemResourceId="finance").
###############################################################################

# Default interest day-count convention for all loan products.
# Valid values (enumId from LOAN_DAY_COUNT_CONV):
#   DAY_COUNT_ACT_365  - Actual/365 Fixed
#   DAY_COUNT_ACT_360  - Actual/360
#   DAY_COUNT_ACT_ACT  - Actual/Actual (ISDA)
#   DAY_COUNT_30_360   - 30/360 Bond Basis
interest.daycount.convention=DAY_COUNT_ACT_365

# Currency-specific interest rounding scale (decimal places).
# Format: currency.scale.<currencyUomId>=<scale>
currency.scale.JPY=0
currency.scale.USD=2
currency.scale.EUR=2

# Currency-specific interest rounding mode.
# Valid values: DOWN (truncate), HALF_UP, UP (ceiling)
# Format: currency.rounding.<currencyUomId>=<mode>
currency.rounding.JPY=DOWN
currency.rounding.USD=HALF_UP
currency.rounding.EUR=HALF_UP

# Default scale and rounding for currencies not explicitly listed above.
currency.scale.default=2
currency.rounding.default=HALF_UP

###############################################################################
# Interest period endpoint convention (利息計算期間の端算入)
# Valid values (enumId from LOAN_PERIOD_ENDPT):
#   PERIOD_BOTH       - Both ends inclusive [from, to]  (両端算入)
#   PERIOD_BACK_EXCL  - Back-end exclusive  [from, to)  (後落とし / 日本標準)
#   PERIOD_FRONT_EXCL - Front-end exclusive (from, to]  (前落とし)
# Default is PERIOD_BOTH to preserve backward compatibility.
# Change to PERIOD_BACK_EXCL for Japanese banking convention.
interest.period.endpoint=PERIOD_BOTH

###############################################################################
# Due-date business-day adjustment convention (営業日調整方式)
# Valid values (enumId from LOAN_DUEDATE_CONV):
#   DUEDATE_NONE       - No adjustment (調整なし / 現行挙動)
#   DUEDATE_FOLLOWING  - Following business day (翌営業日)
#   DUEDATE_PRECEDING  - Preceding business day (前営業日)
#   DUEDATE_MOD_FOLLOW - Modified Following; preceding if month changes (月末は前営業日)
duedate.convention=DUEDATE_NONE

###############################################################################
# Contract-type adapters for the common layer (STEP L0).
# The common delinquency engine processes FinanceContract rows and delegates
# layer-specific work to the adapter configured for the contract type.
# A contract type without an adapter is skipped.
# Format: contract.adapter.<contractTypeId>=<fully qualified class name>
contract.adapter.LOAN=org.apache.ofbiz.finance.accounting.LoanContractAdapter
#contract.adapter.LEASE=  (registered in STEP L6)
