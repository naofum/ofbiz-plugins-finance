###############################################################################
# Finance plugin properties
# These are the system-wide defaults for interest calculation.
# All values can be overridden at runtime via the SystemProperty entity
# (webtools -> SystemProperty, systemResourceId="finance").
###############################################################################

# Default interest day-count convention for all loan products.
# Valid values (enumId from LOAN_DAY_COUNT_CONV):
#   DAY_COUNT_ACT_365  - Actual/365 Fixed
#   DAY_COUNT_ACT_360  - Actual/360
#   DAY_COUNT_ACT_ACT  - Actual/Actual (ISDA)
#   DAY_COUNT_30_360   - 30/360 Bond Basis
interest.daycount.convention=DAY_COUNT_ACT_365

# Currency-specific interest rounding scale (decimal places).
# Format: currency.scale.<currencyUomId>=<scale>
currency.scale.JPY=0
currency.scale.USD=2
currency.scale.EUR=2

# Currency-specific interest rounding mode.
# Valid values: DOWN (truncate), HALF_UP, UP (ceiling)
# Format: currency.rounding.<currencyUomId>=<mode>
currency.rounding.JPY=DOWN
currency.rounding.USD=HALF_UP
currency.rounding.EUR=HALF_UP

# Default scale and rounding for currencies not explicitly listed above.
currency.scale.default=2
currency.rounding.default=HALF_UP

###############################################################################
# Interest period endpoint convention (利息計算期間の端算入)
# Valid values (enumId from LOAN_PERIOD_ENDPT):
#   PERIOD_BOTH       - Both ends inclusive [from, to]  (両端算入)
#   PERIOD_BACK_EXCL  - Back-end exclusive  [from, to)  (後落とし / 日本標準)
#   PERIOD_FRONT_EXCL - Front-end exclusive (from, to]  (前落とし)
# Default is PERIOD_BOTH to preserve backward compatibility.
# Change to PERIOD_BACK_EXCL for Japanese banking convention.
interest.period.endpoint=PERIOD_BOTH

###############################################################################
# Due-date business-day adjustment convention (営業日調整方式)
# Valid values (enumId from LOAN_DUEDATE_CONV):
#   DUEDATE_NONE       - No adjustment (調整なし / 現行挙動)
#   DUEDATE_FOLLOWING  - Following business day (翌営業日)
#   DUEDATE_PRECEDING  - Preceding business day (前営業日)
#   DUEDATE_MOD_FOLLOW - Modified Following; preceding if month changes (月末は前営業日)
duedate.convention=DUEDATE_NONE

###############################################################################
# Contract-type adapters for the common layer (STEP L0).
# The common delinquency engine processes FinanceContract rows and delegates
# layer-specific work to the adapter configured for the contract type.
# A contract type without an adapter is skipped.
# Format: contract.adapter.<contractTypeId>=<fully qualified class name>
contract.adapter.LOAN=org.apache.ofbiz.finance.loan.LoanContractAdapter
# LEASE is registered from STEP L2 for the customer summary / contract navigation;
# its delinquency computation is implemented in STEP L6 (reports none until then).
contract.adapter.LEASE=org.apache.ofbiz.finance.lease.LeaseContractAdapter

###############################################################################
# Underwriting approval validators for non-loan application types (STEP L1).
# The common underwriting status service runs this service with applicationId and
# principalAmount before approving. LOAN keeps the built-in collateral / credit checks.
# Format: underwriting.approval.validator.<applicationTypeId>=<service name>
underwriting.approval.validator.LEASE=financeValidateLeaseUnderwritingApproval

###############################################################################
# Lease (STEP L2)
# Consumption tax rate shown on lease quotes / agreements when the lease product
# is taxable. Booking of the tax (TaxAuthority) is implemented in STEP L5.
lease.tax.rate=0.10

###############################################################################
# Lease consumption tax (STEP L5)
# The rate is taken from the core TaxAuthorityRateProduct (SALES_TAX) of a product
# category of the lease product, for the tax authority geo below, valid at the
# lease start (fixed for the whole contract). Without such a rate lease.tax.rate
# is used and the tax is booked without a tax authority.
lease.tax.authority.geoId=JPN
# Default taxable-sale timing when the lease product has none (LEASE_TAX_TIMING):
#   LEASE_TAX_INSTALL  - per installment (各回): the tax of each lease invoice
#   LEASE_TAX_AT_START - lump sum at the lease start (開始時一括)
# To be confirmed with accounting / tax advisers (REQUIREMENTS_LEASE.md 1.4).
lease.tax.timing=LEASE_TAX_INSTALL

###############################################################################
# Lease delinquency (STEP L6)
# Base of the late fee (遅延損害金) on overdue lease payments:
#   TAX_INCLUDED - unpaid lease payments including consumption tax (default)
#   TAX_EXCLUDED - unpaid lease payments excluding consumption tax
# The annual rate is FinancialProduct.lateFeeAnnualRate of the lease product.
lease.latefee.base=TAX_INCLUDED

###############################################################################
# Lease expiry (STEP L7)
# Leases ending within this many months are listed for expiry and get an
# expiry notice task (runLeaseExpiryBatch).
lease.expiry.notice.months=3

###############################################################################
# Lease public charges (STEP L10 / L10b, 公租公課)
# The rules of each charge type (償却資産税 / 自動車税種別割 / 自動車重量税 ...)
# - default useful life, exemption threshold (免税点), standard rate, rounding,
# assessment date, jurisdiction level and GL accounts - are held in the seed
# entity LeasePublicChargeType (FinanceLeaseTypeData.xml), not in this file.
# The former lease.propertytax.* keys were removed in STEP L10b.

###############################################################################
# Lease maintenance (STEP L11, メンテナンスリース)
# runLeaseMaintScheduleBatch creates the scheduled maintenances (FixedAssetMaint
# + WorkEffort task) of the maintenance plans due within this many months.
lease.maint.schedule.months=2

###############################################################################
# Lease re-lease (STEP L13, 再リース)
# Default annual re-lease fee as a multiple of the original monthly lease amount
# when the product has no FinancialProductLease.reLeaseAnnualFactor (1.0 = one
# month's lease payment per year).
lease.release.annual.factor=1.0
# Default length of a re-lease period in months.
lease.release.months=12
